name: Tests

on:
  push:
    branches:
      - main
      - m39-build # the Milestone 39 integration branch: area PRs merge here first
  pull_request:
    branches:
      - main
      - m39-build
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Run API tests
        run: dotnet test tests/Consultologist.Api.Tests.csproj --configuration Release

      - name: Run client render tests
        run: dotnet test tests/Consultologist.Web.Tests/Consultologist.Web.Tests.csproj --configuration Release

  # #707: real-browser a11y checks bUnit can't do (skip-link focus movement, the
  # run-diagram focus trap). Publishes the WASM app, serves it statically, and
  # drives it (and the shipped dialog-focus.js) with Playwright/Chromium.
  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Build the E2E tests
        run: dotnet build tests/Consultologist.Web.E2E.Tests/Consultologist.Web.E2E.Tests.csproj -c Release

      - name: Install Chromium
        run: pwsh build/bin/Consultologist.Web.E2E.Tests/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Publish, serve and run the E2E a11y tests
        # The one sequence CI and the build server run (BUILD-RUNBOOK.md step 6): publish with
        # -p:E2E=true (#710), serve with SPA fallback, test, stop the server. Quiet by default;
        # add -v to stream the server's request log.
        run: .github/scripts/run-e2e.sh
