name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Run API tests
        run: dotnet test tests/Consultologist.Api.Tests.csproj --configuration Release

      - name: Run client render tests
        run: dotnet test tests/Consultologist.Web.Tests/Consultologist.Web.Tests.csproj --configuration Release

  # #707: real-browser a11y checks bUnit can't do (skip-link focus movement, the
  # run-diagram focus trap). Publishes the WASM app, serves it statically, and
  # drives it (and the shipped dialog-focus.js) with Playwright/Chromium.
  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Publish the web app
        run: dotnet publish src/Consultologist.Web/Consultologist.Web.csproj -c Release -o publish

      - name: Build the E2E tests
        run: dotnet build tests/Consultologist.Web.E2E.Tests/Consultologist.Web.E2E.Tests.csproj -c Release

      - name: Install Chromium
        run: pwsh build/bin/Consultologist.Web.E2E.Tests/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Serve the app and run E2E a11y tests
        env:
          E2E_BASE_URL: http://localhost:5000
        run: |
          # Serve and test in one step: a backgrounded server does not reliably
          # survive into a later step (each step is a fresh shell).
          python3 -m http.server 5000 --directory publish/wwwroot &
          server=$!
          for i in $(seq 1 30); do curl -sf http://localhost:5000/ >/dev/null && break; sleep 1; done
          dotnet test tests/Consultologist.Web.E2E.Tests/Consultologist.Web.E2E.Tests.csproj -c Release
          status=$?
          kill "$server" 2>/dev/null || true
          exit $status
