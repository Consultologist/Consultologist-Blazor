name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - "src/Consultologist.Api/**" # Don't rebuild static web app when only API changes
      - "src/Consultologist.PackageFormat/**" # #450: the format library is the API's, not the client's
      - "tests/**" # ...or when only tests change
      - "docs/**" # ...or when only documentation changes
      - "*.md"
      - ".github/workflows/tests.yml"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  workflow_dispatch:

# One run per branch at a time, newest wins. The close-event run is always
# the newest in its group, so a superseded in-flight PR build can never
# finish after the close and re-create the staging environment (#156 — the
# leak was exactly that race, not a close-job failure).
concurrency:
  group: swa-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          lfs: false

      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client

      - name: Get Id Token
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: idtoken
        with:
          script: |
            const coredemo = require('@actions/core')
            return await coredemo.getIDToken()
          result-encoding: string

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GENTLE_DESERT_09697700F }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          # Oryx detects the Blazor project, installs the SDK + wasm-tools in its own
          # container, and publishes to its staging folder; the static content ends up
          # in wwwroot/ inside the publish output.
          app_location: "src/Consultologist.Web" # App source code path for the standalone Blazor WASM project
          api_location: "" # Empty - Azure Functions deployed separately
          output_location: "wwwroot" # Blazor static content within the publish output
          github_id_token: ${{ steps.idtoken.outputs.result }} # Required: this SWA uses GitHub OIDC deployment authorization (the "unexpected input" warning is benign)
          # Dependabot-triggered runs are deliberately denied repository secrets
          # by GitHub, so the deployment token is absent and this step would
          # fail with "deployment_token was not provided" — on every Dependabot
          # PR, regardless of what it changes. A permanently red check is worse
          # than no check: it trains reviewers to merge past red. With this set
          # the step still builds and simply skips the upload, so the build
          # itself becomes real signal on exactly the PRs that most need it.
          skip_deploy_on_missing_secrets: true
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client

      - name: Get Id Token
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: idtoken
        with:
          script: |
            const coredemo = require('@actions/core')
            return await coredemo.getIDToken()
          result-encoding: string

      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          action: "close"
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GENTLE_DESERT_09697700F }}
          github_id_token: ${{ steps.idtoken.outputs.result }} # Required: this SWA uses GitHub OIDC deployment authorization (see build job)
