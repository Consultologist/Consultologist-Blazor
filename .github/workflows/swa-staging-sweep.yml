name: SWA staging sweep

# The weekly janitor (#182): deletes staging environments whose PR is no
# longer open, catching leaks regardless of cause — belt-and-braces over
# the per-branch concurrency fix (#156) that eliminated the known race.

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    environment: sweep
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_SWEEP_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sweep stale staging environments
        run: |
          set -euo pipefail
          SWEPT=0
          FAILED=0
          while IFS=$'\t' read -r NAME BRANCH; do
            [ "$NAME" = "default" ] && continue
            [ -z "$NAME" ] && continue

            OPEN=""
            if [[ "$NAME" =~ ^[0-9]+$ ]]; then
              STATE=$(gh pr view "$NAME" --repo "$GITHUB_REPOSITORY" --json state -q .state 2>/dev/null || echo "UNKNOWN")
              [ "$STATE" = "OPEN" ] && OPEN=yes
            fi
            if [ -z "$OPEN" ] && [ -n "$BRANCH" ]; then
              COUNT=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number -q length)
              [ "${COUNT:-0}" != "0" ] && OPEN=yes
            fi

            if [ -z "$OPEN" ]; then
              echo "Sweeping environment '$NAME' (branch: ${BRANCH:-?}) — no open PR"

              # The delete lands; what fails is the CLI polling the operation
              # status afterwards, which lives under
              # /subscriptions/.../locations/<region>/staticSitesOperationStatuses
              # — a scope this principal is not granted, and not worth widening
              # it to subscription level for a status read.
              #
              # So the environment listing is the arbiter, not the exit code:
              # losing the poll must not be read as losing the deletion, and
              # must not abandon every environment after this one (#182 was
              # about leaks surviving unnoticed, which is exactly what an
              # aborted loop would cause).
              az staticwebapp environment delete -n consultologist-blazor \
                --environment-name "$NAME" --yes || true

              REMAINING=$(az staticwebapp environment list -n consultologist-blazor \
                --query "length([?name=='$NAME'])" -o tsv 2>/dev/null || echo "?")

              if [ "$REMAINING" = "0" ]; then
                echo "  removed."
                SWEPT=$((SWEPT + 1))
              else
                echo "::error::environment '$NAME' is still present after the delete (remaining: $REMAINING)"
                FAILED=$((FAILED + 1))
              fi
            else
              echo "Keeping environment '$NAME' (branch: $BRANCH) — PR open"
            fi
          done < <(az staticwebapp environment list -n consultologist-blazor --query "[].[name, sourceBranch]" -o tsv)
          echo "Sweep complete: $SWEPT environment(s) removed, $FAILED failed."

          # Fail only on an environment that is genuinely still there.
          [ "$FAILED" -eq 0 ]
