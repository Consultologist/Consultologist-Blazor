# Docs for the Azure Web Apps Deploy action: https://github.com/azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy dotnet core project to Azure Function App - canada-east-ai-function

on:
  # Release-driven deploy: the engine ships from a tagged GitHub Release, so
  # production is always a known release and every record's engineRelease points
  # at a versioned page. Cut a release (its tag becomes engineRelease) to deploy.
  release:
    types: [published]
  # The manual door — a hotfix or a re-run of a failed deploy. It carries no
  # release tag, so the build stamps only the commit and records fall back to it.
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: "src/Consultologist.Api" # Path to Azure Function project
  DOTNET_VERSION: "10.0.x" # set this to the dotnet version to use

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: "Checkout GitHub Action"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Setup DotNet ${{ env.DOTNET_VERSION }} Environment
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: "Resolve Project Dependencies Using Dotnet"
        shell: bash
        # The release tag through an env var, not inline in the command, so a
        # tag string cannot inject into the build line (workflow-injection guard).
        # Empty on a manual workflow_dispatch — the csproj then stamps no release.
        env:
          ENGINE_RELEASE: ${{ github.event.release.tag_name }}
        run: |
          pushd './${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}'
          # #449: the deployed engine reports this commit from GET /api/Public/Engine,
          # and content CI checks it out to validate against what actually runs.
          # The engine also reports the release it was deployed from (engineRelease),
          # stamped as assembly metadata from the tag that triggered this run.
          dotnet build --configuration Release --output ./output -p:SourceRevisionId=${{ github.sha }} -p:EngineRelease="$ENGINE_RELEASE" -p:ContinuousIntegrationBuild=true
          popd

      - name: Login to Azure
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_BD48734B3BF54596889E52B40C8DB9BC }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3A6E0C076D014F97B72013A8FAF73817 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_446D6ACA8E9B4280AB0466590D8DEE0A }}

      - name: "Run Azure Functions Action"
        uses: Azure/functions-action@c5060b3b8bb1ebbcb531abd00c822ecbaa8ea656 # v1
        id: fa
        with:
          app-name: "canada-east-ai-function"
          slot-name: "Production"
          package: "${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/output"
